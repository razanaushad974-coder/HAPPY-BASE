name: One-time Supabase dependency lock and build check

on:
  push:
    branches:
      - happy/supabase-auth-tenant-foundation

permissions:
  contents: write

jobs:
  lock-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: happy/supabase-auth-tenant-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove one-time workflow and commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-supabase-lock-check.yml
          git add package-lock.json
          git commit -m "chore: lock Supabase dependencies and remove bootstrap workflow"
          git push origin HEAD:happy/supabase-auth-tenant-foundation

      - name: Install from locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build application
        run: npm run build
