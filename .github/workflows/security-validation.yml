name: HAPPY security validation

on:
  pull_request:
    branches:
      - main
      - security/file-mutation-authorizer
      - happy/server-verified-pipeline-approval
      - security/durable-file-mutation-grants
    paths:
      - "src/core/approval/**"
      - "src/core/tenant/**"
      - "src/core/execution/**"
      - "src/core/evidence/**"
      - "src/core/orchestration/**"
      - "src/core/mission/**"
      - "src/core/persistence/**"
      - "src/core/state/**"
      - "src/core/memory/**"
      - "src/core/verification/**"
      - "src/tests/core/approval/**"
      - "src/tests/core/tenant/**"
      - "src/tests/core/evidence/**"
      - "src/tests/core/verification/**"
      - "src/tests/core/orchestration/**"
      - "src/tests/core/mission/**"
      - "src/tests/core/persistence/**"
      - "src/tests/core/state/**"
      - "scripts/security/**"
      - "supabase/drafts/**"
      - "docs/architecture/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/security-validation.yml"
  push:
    branches:
      - security/durable-file-mutation-grants
      - platform/full-happy-audit-and-integration

permissions:
  contents: read

concurrency:
  group: happy-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, lint, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: happy_test
          POSTGRES_DB: happy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d happy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: happy_test
      PGDATABASE: happy_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Security harnesses
        run: npm run test:security
      - name: Async tenant persistence contract
        run: npx --yes tsx@4.23.15 src/tests/core/persistence/async-tenant-repository.test.ts
      - name: Persistence provider durability contract
        run: npx --yes tsx@4.23.15 src/tests/core/persistence/persistence-provider-durability.test.ts
      - name: PostgreSQL tenant adapter contract
        run: npx --yes tsx@4.23.15 src/tests/core/persistence/postgres-tenant-adapter.test.ts
      - name: PostgreSQL reconciliation evidence store contract
        run: npx --yes tsx@4.23.15 src/tests/core/persistence/postgres-provider-reconciliation-evidence-store.test.ts
      - name: Validate PostgreSQL harness shell syntax
        run: bash -n scripts/security/postgres-tenant-persistence-integration.sh scripts/security/postgres-tenant-cas-concurrency.sh scripts/security/postgres-reconciliation-evidence-concurrency.sh
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: PostgreSQL RLS and CAS integration
        run: bash scripts/security/postgres-tenant-persistence-integration.sh
      - name: Async tenant memory contract
        run: npx --yes tsx@4.23.15 src/tests/core/persistence/async-persistent-memory.test.ts
      - name: Async HAPPY state store contract
        run: npx --yes tsx@4.23.15 src/tests/core/state/async-happy-state-store.test.ts
      - name: Async tenant evidence contract
        run: npx --yes tsx@4.23.15 src/tests/core/evidence/async-evidence-service.test.ts
      - name: Async tenant verification contract
        run: npx --yes tsx@4.23.15 src/tests/core/verification/async-verification-service.test.ts
      - name: Orchestration and mission harnesses
        run: npx --yes tsx@4.23.15 src/tests/core/orchestration/orchestration.test.ts && npx --yes tsx@4.23.15 src/tests/core/mission/mission-task-graph.test.ts
      - name: ESLint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Production build
        run: npm run build
